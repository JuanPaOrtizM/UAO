<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Análisis de Datos y Segmentación con IA · Full Stack Marketing Digital con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f;
  --ink-soft:#48484c;
  --grey:#6e6e73;
  --grey-soft:#86868b;
  --hair:#d2d2d7;
  --bg:#fbfbfd;
  --card:#ffffff;
  --card-tint:#f5f5f7;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);

  /* modulo neutral gradient (cover/agenda) */
  --a1:#0071e3; --a2:#af52de; --a3:#0a7f76;

  /* clase activa (se re-asigna via JS) */
  --accent:#0071e3;
  --accent-2:#42a5f5;
  --accent-soft:#eaf2fe;
  --accent-ink:#0a3d75;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono', monospace;}

/* ---------- animated background ---------- */
#bg{position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg);}
#bg .orb{
  position:absolute; border-radius:50%; filter:blur(70px);
  opacity:.55; will-change:transform; transition:background 1.1s ease;
  mix-blend-mode:normal;
}
#bg .orb.o1{width:52vw; height:52vw; left:-14vw; top:-18vw; background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%); animation:float1 26s ease-in-out infinite;}
#bg .orb.o2{width:44vw; height:44vw; right:-12vw; top:6vw; background:radial-gradient(circle at 60% 40%, var(--accent-2), transparent 70%); animation:float2 32s ease-in-out infinite;}
#bg .orb.o3{width:40vw; height:40vw; left:18vw; bottom:-20vw; background:radial-gradient(circle at 50% 50%, var(--a2), transparent 72%); opacity:.28; animation:float3 38s ease-in-out infinite;}
#bg .grain{position:absolute; inset:0; opacity:.025; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
#bg .veil{position:absolute; inset:0; background:linear-gradient(180deg, rgba(251,251,253,.35), rgba(251,251,253,.86) 62%, rgba(251,251,253,.97));}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(6vw,8vw) scale(1.12);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-7vw,6vw) scale(0.92);}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(4vw,-6vw) scale(1.08);}}
@media (prefers-reduced-motion: reduce){ #bg .orb{animation:none;} }

/* ---------- deck shell ---------- */
#deck{position:relative; z-index:1; height:100dvh; width:100vw;}
.slide{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:7vh 8vw; opacity:0; pointer-events:none; transform:translateY(14px) scale(.99);
  transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
}
.slide.active{opacity:1; pointer-events:auto; transform:translateY(0) scale(1);}
.slide-inner{width:100%; max-width:1180px; margin:0 auto;}

/* ---------- eyebrow / kicker ---------- */
.kicker{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:18px;}
.kicker .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
.kicker span{font-size:15px; font-weight:600; color:var(--accent-ink); letter-spacing:.01em;}
.slide-inner.left .kicker{justify-content:flex-start;}

/* ---------- typography ---------- */
h1.big{font-size:clamp(38px,5.4vw,74px); font-weight:800; letter-spacing:-.02em; line-height:1.03; margin:0 0 18px; text-align:center;}
h1.mid{font-size:clamp(30px,4vw,48px); font-weight:700; letter-spacing:-.015em; line-height:1.08; margin:0 0 14px;}
p.lede{font-size:clamp(17px,1.7vw,22px); color:var(--ink-soft); line-height:1.55; text-align:center; max-width:760px; margin:0 auto;}
p.body{font-size:16.5px; color:var(--ink-soft); line-height:1.6;}
.center{text-align:center;}

/* ---------- COVER ---------- */
.cover-num{font-family:'JetBrains Mono'; font-size:14px; color:var(--grey); letter-spacing:.08em; margin-bottom:26px;}
.cover-title{font-size:clamp(44px,7vw,92px); font-weight:800; letter-spacing:-.025em; line-height:1.0;
  background:linear-gradient(100deg, var(--a1), var(--a2) 55%, var(--a3)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.cover-sub{font-size:clamp(17px,2vw,23px); color:var(--ink-soft); margin-top:22px; max-width:640px;}
.cover-meta{margin-top:52px; display:flex; gap:28px; flex-wrap:wrap; justify-content:center;}
.cover-meta .chip{display:flex; align-items:center; gap:9px; font-size:14px; color:var(--grey); border:1px solid var(--hair); padding:9px 16px; border-radius:100px; background:rgba(255,255,255,.6); backdrop-filter:blur(6px);}
.cover-meta .chip svg{width:16px; height:16px; stroke:var(--grey);}

/* ---------- CLASS INTRO (section divider) ---------- */
.type-classintro{color:#fff;}
.type-classintro .wrap{position:absolute; inset:0; background:linear-gradient(150deg, var(--accent), var(--accent-2)); z-index:-1;}
.type-classintro .tag{font-size:15px; font-weight:600; letter-spacing:.02em; opacity:.85; margin-bottom:18px;}
.type-classintro .num{font-family:'JetBrains Mono'; font-size:clamp(70px,11vw,150px); font-weight:600; opacity:.22; line-height:1; margin-bottom:-.15em;}
.type-classintro h1{font-size:clamp(36px,5.6vw,66px); font-weight:800; letter-spacing:-.02em; line-height:1.06; max-width:900px;}
.type-classintro p{font-size:clamp(16px,1.7vw,20px); opacity:.92; max-width:620px; margin-top:16px; line-height:1.5;}
.type-classintro .topics{margin-top:38px; display:flex; gap:14px; flex-wrap:wrap;}
.type-classintro .topics span{font-size:13.5px; padding:8px 15px; border-radius:100px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);}

/* ---------- TOPIC HEADER ---------- */
.type-topicheader .eyebrow{font-size:14px; font-weight:600; color:var(--accent); margin-bottom:14px;}
.type-topicheader h1{font-size:clamp(30px,4.4vw,52px); font-weight:800; letter-spacing:-.02em; max-width:820px;}
.type-topicheader .rule{width:64px; height:4px; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); margin:22px 0;}
.type-topicheader .items{display:flex; flex-direction:column; gap:9px; margin-top:10px;}
.type-topicheader .items div{font-size:16px; color:var(--ink-soft); display:flex; align-items:center; gap:10px;}
.type-topicheader .items div svg{width:16px; height:16px; stroke:var(--grey-soft); flex:none;}

/* ---------- CONTENT header row ---------- */
.head-row{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:30px; flex-wrap:wrap;}
.head-row .eyebrow{font-size:13px; font-weight:600; color:var(--accent); text-transform:none; letter-spacing:.01em;}
.head-row h2{font-size:clamp(24px,2.6vw,34px); font-weight:700; letter-spacing:-.015em; margin:6px 0 0; max-width:680px;}
.head-row .step{font-family:'JetBrains Mono'; font-size:13px; color:var(--grey-soft);}

/* ---------- card grid ---------- */
.grid{display:grid; gap:16px;}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.c4{grid-template-columns:repeat(4,1fr);}
.card{background:var(--card); border:1px solid var(--hair); border-radius:20px; padding:22px 22px; box-shadow:var(--shadow);}
.card .ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); margin-bottom:14px;}
.card .ic svg{width:20px; height:20px; stroke:var(--accent-ink);}
.card h3{font-size:16.5px; font-weight:650; margin:0 0 6px; letter-spacing:-.005em;}
.card p{font-size:14.5px; color:var(--grey); line-height:1.5; margin:0;}

/* ---------- stat grid ---------- */
.stat{background:var(--card); border:1px solid var(--hair); border-radius:20px; padding:26px 22px; box-shadow:var(--shadow);}
.stat .num{font-family:'JetBrains Mono'; font-size:clamp(26px,3vw,38px); font-weight:600; color:var(--accent-ink); letter-spacing:-.01em;}
.stat .lbl{font-size:14px; color:var(--grey); margin-top:8px; line-height:1.4;}

/* ---------- split layout ---------- */
.split{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
.split .txt h2{font-size:clamp(24px,2.8vw,36px); font-weight:750; letter-spacing:-.015em; margin:0 0 16px;}
.split .txt p{font-size:16.5px; color:var(--ink-soft); line-height:1.62;}
.split .visual{display:flex; flex-direction:column; gap:12px;}
.rowline{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--hair); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow);}
.rowline .ic{width:34px; height:34px; border-radius:9px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; flex:none;}
.rowline .ic svg{width:18px; height:18px; stroke:var(--accent-ink);}
.rowline .t{font-size:14.5px; color:var(--ink); font-weight:500;}
.rowline .t b{font-weight:650;}

/* ---------- timeline ---------- */
.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{display:grid; grid-template-columns:120px 24px 1fr; gap:0; align-items:start;}
.tl-item .yr{font-family:'JetBrains Mono'; font-size:13.5px; color:var(--grey-soft); padding-top:2px;}
.tl-item .rail{display:flex; flex-direction:column; align-items:center; height:100%;}
.tl-item .rail .d{width:11px; height:11px; border-radius:50%; background:var(--accent); margin-top:4px; flex:none;}
.tl-item .rail .l{flex:1; width:2px; background:var(--hair); margin-top:4px;}
.tl-item:last-child .rail .l{display:none;}
.tl-item .tx{padding:0 0 26px 20px;}
.tl-item .tx h4{margin:0 0 4px; font-size:16px; font-weight:650;}
.tl-item .tx p{margin:0; font-size:14.5px; color:var(--grey); line-height:1.5;}

/* ---------- comparison table ---------- */
.cmp{display:grid; gap:16px;}
.cmp-card{background:var(--card); border:1.5px solid var(--hair); border-radius:20px; padding:24px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;}
.cmp-card.hi{border-color:var(--accent); box-shadow:0 4px 26px rgba(0,0,0,.08);}
.cmp-card .top{display:flex; align-items:center; gap:12px;}
.cmp-card .top .ic{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; flex:none;}
.cmp-card .top .ic svg{width:19px; height:19px; stroke:var(--accent-ink);}
.cmp-card .top h3{font-size:16.5px; font-weight:700; margin:0;}
.cmp-card .top .pill{font-size:11px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); padding:3px 9px; border-radius:100px; margin-left:auto;}
.cmp-card ul{margin:0; padding-left:18px;}
.cmp-card li{font-size:14px; color:var(--grey); line-height:1.55; margin-bottom:3px;}

/* ---------- checklist ---------- */
.checklist{display:flex; flex-direction:column; gap:11px; max-width:760px; margin:0 auto;}
.chk{display:flex; align-items:flex-start; gap:14px; background:var(--card); border:1px solid var(--hair); border-radius:16px; padding:15px 18px; box-shadow:var(--shadow);}
.chk .n{font-family:'JetBrains Mono'; font-size:13px; color:#fff; background:var(--accent); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;}
.chk .t{font-size:15px; color:var(--ink); line-height:1.5;}
.chk .t b{font-weight:650;}

/* ---------- callout / quote ---------- */
.callout{max-width:880px; margin:0 auto; text-align:center;}
.callout .mark{font-size:56px; color:var(--accent); font-weight:800; line-height:.5; display:block; margin-bottom:18px;}
.callout .q{font-size:clamp(22px,2.6vw,32px); font-weight:650; letter-spacing:-.015em; line-height:1.35; color:var(--ink);}
.callout .src{margin-top:20px; font-size:14px; color:var(--grey);}

/* ---------- exercise slide ---------- */
.exercise{background:var(--card); border:1px solid var(--hair); border-radius:28px; box-shadow:0 4px 32px rgba(0,0,0,.08); padding:44px 48px; max-width:980px; margin:0 auto;}
.exercise .tag{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:650; color:#fff; background:var(--accent); padding:7px 14px; border-radius:100px; margin-bottom:20px; white-space:nowrap;}
.exercise .tag svg{width:14px; height:14px; stroke:#fff; flex:none;}
.exercise h2{font-size:clamp(26px,3.2vw,38px); font-weight:800; letter-spacing:-.02em; margin:0 0 12px;}
.exercise p.ctx{font-size:16px; color:var(--ink-soft); line-height:1.6; max-width:760px;}
.exercise .meta{display:flex; gap:26px; margin:22px 0 26px; flex-wrap:wrap;}
.exercise .meta div{font-size:13.5px; color:var(--grey); display:flex; align-items:center; gap:8px;}
.exercise .meta svg{width:16px; height:16px; stroke:var(--grey-soft);}
.exercise .goals{display:flex; flex-direction:column; gap:8px; margin-bottom:28px;}
.exercise .goals div{font-size:14.5px; color:var(--ink-soft); display:flex; gap:10px; align-items:flex-start;}
.exercise .goals svg{width:16px; height:16px; stroke:var(--accent); flex:none; margin-top:2px;}
.dl-row{display:flex; gap:14px; flex-wrap:wrap;}
.dl-btn{display:flex; align-items:center; gap:10px; padding:13px 20px; border-radius:14px; text-decoration:none; font-size:14.5px; font-weight:650; transition:transform .15s ease, box-shadow .15s ease;}
.dl-btn.primary{background:var(--ink); color:#fff;}
.dl-btn.secondary{background:var(--card-tint); color:var(--ink); border:1px solid var(--hair);}
.dl-btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.14);}
.dl-btn svg{width:17px; height:17px;}
.dl-btn.primary svg{stroke:#fff;}
.dl-btn.secondary svg{stroke:var(--ink);}

/* ---------- case study ---------- */
.case-grid{display:grid; gap:16px;}
.case-card{background:linear-gradient(180deg, var(--card), var(--card-tint)); border:1px solid var(--hair); border-radius:20px; padding:24px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px;}
.case-card .co{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.case-card .co h3{font-size:17px; font-weight:750; margin:0; letter-spacing:-.005em;}
.case-card .co span{font-size:11.5px; font-weight:650; color:var(--accent-ink); background:var(--accent-soft); padding:4px 10px; border-radius:100px; white-space:nowrap;}
.case-card .res{display:flex; gap:18px; flex-wrap:wrap; margin:4px 0 2px;}
.case-card .res div{display:flex; flex-direction:column;}
.case-card .res .n{font-family:'JetBrains Mono'; font-size:22px; font-weight:600; color:var(--accent-ink);}
.case-card .res .l{font-size:11.5px; color:var(--grey); margin-top:2px;}
.case-card p{font-size:14px; color:var(--grey); line-height:1.55; margin:0;}
.case-src{font-size:12px; color:var(--grey-soft); margin-top:18px; text-align:center;}

/* ---------- closing ---------- */
.closing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:40px; max-width:980px;}
.closing-grid .c{background:var(--card); border:1px solid var(--hair); border-radius:18px; padding:20px; box-shadow:var(--shadow);}
.closing-grid .c .k{font-family:'JetBrains Mono'; font-size:12px; color:var(--accent-ink); margin-bottom:8px;}
.closing-grid .c h4{margin:0 0 6px; font-size:15px; font-weight:650;}
.closing-grid .c p{margin:0; font-size:13px; color:var(--grey); line-height:1.5;}

/* ---------- nav chrome ---------- */
#chrome{position:fixed; inset:0; z-index:5; pointer-events:none;}
#topbar{position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:22px 30px; pointer-events:none;}
#brand{font-size:13px; font-weight:650; color:var(--ink); display:flex; align-items:center; gap:9px; pointer-events:auto; opacity:.85;}
#brand .sw{width:8px; height:8px; border-radius:50%; background:var(--accent); transition:background .5s;}
#classdots{display:flex; gap:9px; pointer-events:auto;}
#classdots button{width:34px; height:5px; border-radius:4px; border:none; background:var(--hair); cursor:pointer; padding:0; transition:background .3s, width .3s;}
#classdots button.on{background:var(--accent); width:46px;}
#progress-wrap{position:fixed; left:0; right:0; bottom:0; height:3px; background:rgba(0,0,0,.06); z-index:6;}
#progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .4s ease, background .6s;}
#counter{position:fixed; right:30px; bottom:20px; font-family:'JetBrains Mono'; font-size:12.5px; color:var(--grey); pointer-events:auto; z-index:6;}
.navbtn{position:fixed; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%; border:1px solid var(--hair); background:rgba(255,255,255,.75); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; z-index:6; box-shadow:var(--shadow); transition:opacity .2s, transform .15s;}
.navbtn:hover{transform:translateY(-50%) scale(1.06);}
.navbtn svg{width:19px; height:19px; stroke:var(--ink);}
#prevBtn{left:22px;} #nextBtn{right:22px;}
.navbtn.hide{opacity:0; pointer-events:none;}
#hint{position:fixed; left:30px; bottom:20px; font-size:12px; color:var(--grey-soft); pointer-events:none; z-index:6;}
@media (max-width: 820px){
  #hint{display:none;}
  .navbtn{width:40px; height:40px;}
  .split{grid-template-columns:1fr; gap:26px;}
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr 1fr;}
  .closing-grid{grid-template-columns:1fr;}
  #topbar{padding:16px 18px;}
  .slide{padding:9vh 6vw;}
}
@media (max-width:560px){
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;}
  .tl-item{grid-template-columns:70px 20px 1fr;}
}
</style>
</head>
<body data-class="0">

<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div><div class="veil"></div></div>

<div id="deck"></div>

<div id="chrome">
  <div id="topbar">
    <div id="brand"><span class="sw"></span>Análisis de Datos y Segmentación con IA</div>
    <div id="classdots">
      <button data-jump="class1" title="Clase 1"></button>
      <button data-jump="class2" title="Clase 2"></button>
      <button data-jump="class3" title="Clase 3"></button>
    </div>
  </div>
  <button class="navbtn" id="prevBtn" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="navbtn" id="nextBtn" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <div id="hint">Usa las flechas del teclado o desliza para navegar</div>
  <div id="counter">01 / 01</div>
</div>
<div id="progress-wrap"><div id="progress-bar"></div></div>

<script>
// ============================================================
// ICONOS — set propio de líneas, estilo trazo simple (stroke)
// ============================================================
const ICONP = {
  chart: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 15l2.5-3.5L13 14l3-5"/>',
  bars: '<path d="M4 20V10M10 20V4M16 20v-7M22 20v-3" transform="translate(-1,0)"/>',
  brain: '<path d="M9 4a3 3 0 0 0-3 3v.3A3 3 0 0 0 4 10v1a3 3 0 0 0 1.5 2.6A3 3 0 0 0 8 18a3 3 0 0 0 3-3V6a2 2 0 0 0-2-2z"/><path d="M15 4a3 3 0 0 1 3 3v.3A3 3 0 0 1 20 10v1a3 3 0 0 1-1.5 2.6A3 3 0 0 1 16 18a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2z"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  chat: '<path d="M4 5h16v11H8l-4 4V5z"/>',
  funnel: '<path d="M3 4h18l-7 9v6l-4 2v-8L3 4z"/>',

// ============================================================
// RENDER HELPERS por tipo de diapositiva
// ============================================================
function elKicker(txt){ return `<div class="kicker"><span class="dot"></span><span>${txt}</span></div>`; }

function rCover(s){
  return `<div class="slide-inner center">
    <div class="cover-num mono">MÓDULO · FULL STACK MARKETING DIGITAL CON IA</div>
    <div class="cover-title">${s.title}</div>
    <p class="cover-sub">${s.sub}</p>
    <div class="cover-meta">
      ${s.chips.map(c=>`<div class="chip">${ic(c.icon)}<span>${c.t}</span></div>`).join('')}
    </div>
  </div>`;
}

function rAgenda(s){
  return `<div class="slide-inner">
    ${elKicker(s.kicker)}
    <h1 class="big">${s.title}</h1>
    <p class="lede">${s.lede}</p>
    <div class="grid c3" style="margin-top:44px;">
      ${s.items.map(it=>`
        <div class="card" style="border-top:3px solid ${it.color}">
          <div class="ic" style="background:${it.color}1a"><span style="color:${it.color}">${ic(it.icon)}</span></div>
          <h3>${it.h}</h3>
          <p>${it.p}</p>
        </div>`).join('')}
    </div>
  </div>`;
}

function rClassIntro(s){
  return `<div class="wrap"></div><div class="slide-inner">
    <div class="tag">${s.tag}</div>
    <div class="num">${s.num}</div>
    <h1>${s.title}</h1>
    <p>${s.p}</p>
    <div class="topics">${s.topics.map(t=>`<span>${t}</span>`).join('')}</div>
  </div>`;
}

function rTopicHeader(s){
  return `<div class="slide-inner">
    <div class="eyebrow">${s.eyebrow}</div>
    <h1>${s.title}</h1>
    <div class="rule"></div>
    <div class="items">${s.items.map(i=>`<div>${ic('check')}${i}</div>`).join('')}</div>
  </div>`;
}

function rHead(s){
  return `<div class="head-row"><div><div class="eyebrow">${s.eyebrow}</div><h2>${s.h}</h2></div>${s.step?`<div class="step">${s.step}</div>`:''}</div>`;
}

function rCards(s){
  const cols = s.cols||3;
  return `<div class="slide-inner">${rHead(s)}
    <div class="grid c${cols}">
      ${s.cards.map(c=>`<div class="card">
        <div class="ic">${ic(c.icon)}</div>
        <h3>${c.h}</h3>
        <p>${c.p}</p>
      </div>`).join('')}
    </div>
    ${s.foot?`<p class="body" style="margin-top:22px; max-width:820px;">${s.foot}</p>`:''}
  </div>`;
}

function rStats(s){
  return `<div class="slide-inner">${rHead(s)}
    <div class="grid c${s.stats.length>4?4:s.stats.length}">
      ${s.stats.map(x=>`<div class="stat"><div class="num">${x.n}</div><div class="lbl">${x.l}</div></div>`).join('')}
    </div>
    ${s.foot?`<p class="body" style="margin-top:22px; max-width:820px;">${s.foot}</p>`:''}
  </div>`;
}

function rSplit(s){
  const visual = s.visualType==='rows'
    ? `<div class="visual">${s.rows.map(r=>`<div class="rowline"><div class="ic">${ic(r.icon)}</div><div class="t">${r.t}</div></div>`).join('')}</div>`
    : s.visualType==='timeline'
    ? `<div class="visual timeline">${s.tl.map((t,i)=>`<div class="tl-item"><div class="yr">${t.yr}</div><div class="rail"><div class="d"></div><div class="l"></div></div><div class="tx"><h4>${t.h}</h4><p>${t.p}</p></div></div>`).join('')}</div>`
    : '';
  return `<div class="slide-inner">${rHead(s)}
    <div class="split" style="margin-top:8px;">
      <div class="txt"><p>${s.text}</p></div>
      ${visual}
    </div>
  </div>`;
}

function rTimelineFull(s){
  return `<div class="slide-inner">${rHead(s)}
    <div class="timeline" style="max-width:760px;">
      ${s.tl.map(t=>`<div class="tl-item"><div class="yr">${t.yr}</div><div class="rail"><div class="d"></div><div class="l"></div></div><div class="tx"><h4>${t.h}</h4><p>${t.p}</p></div></div>`).join('')}
    </div>
  </div>`;
}

function rCompare(s){
  return `<div class="slide-inner">${rHead(s)}
    <div class="cmp" style="grid-template-columns:repeat(${s.cards.length},1fr);">
      ${s.cards.map(c=>`<div class="cmp-card ${c.hi?'hi':''}">
        <div class="top"><div class="ic">${ic(c.icon)}</div><h3>${c.h}</h3>${c.pill?`<span class="pill">${c.pill}</span>`:''}</div>
        <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>
  </div>`;
}

function rChecklist(s){
  return `<div class="slide-inner">${rHead(s)}
    <div class="checklist">
      ${s.items.map((t,i)=>`<div class="chk"><div class="n mono">${i+1}</div><div class="t">${t}</div></div>`).join('')}
    </div>
  </div>`;
}

function rCallout(s){
  return `<div class="slide-inner"><div class="callout">
    <span class="mark">&ldquo;</span>
    <div class="q">${s.q}</div>
    <div class="src">${s.src}</div>
  </div></div>`;
}

function rExercise(s){
  return `<div class="slide-inner center">
    <div class="exercise" style="text-align:left;">
      <span class="tag">${ic('rocket')}&nbsp;${s.tag}</span>
      <h2>${s.title}</h2>
      <p class="ctx">${s.ctx}</p>
      <div class="meta">
        <div>${ic('clock')}${s.dur}</div>
        <div>${ic('database')}${s.data}</div>
        <div>${ic('compass')}${s.tool}</div>
      </div>
      <div class="goals">${s.goals.map(g=>`<div>${ic('check')}<span>${g}</span></div>`).join('')}</div>
      <div class="dl-row">
        <a class="dl-btn primary" href="${s.guideHref}" download>${ic('file')}Descargar guía del ejercicio (.docx)</a>
        <a class="dl-btn secondary" href="${s.dataHref}" download>${ic('download')}Descargar dataset (.csv)</a>
      </div>
    </div>
  </div>`;
}

function rCase(s){
  return `<div class="slide-inner">${rHead(s)}
    <div class="case-grid" style="grid-template-columns:repeat(${s.cases.length>2?2:s.cases.length},1fr);">
      ${s.cases.map(c=>`<div class="case-card">
        <div class="co"><h3>${c.co}</h3><span>${c.tag}</span></div>
        <div class="res">${c.stats.map(x=>`<div><span class="n mono">${x.n}</span><span class="l">${x.l}</span></div>`).join('')}</div>
        <p>${c.p}</p>
      </div>`).join('')}
    </div>
    ${s.src?`<div class="case-src">${s.src}</div>`:''}
  </div>`;
}

function rClosing(s){
  return `<div class="slide-inner center">
    ${elKicker(s.kicker)}
    <h1 class="big">${s.title}</h1>
    <p class="lede">${s.lede}</p>
    <div class="closing-grid" style="margin-left:auto;margin-right:auto;">
      ${s.cols.map(c=>`<div class="c"><div class="k mono">${c.k}</div><h4>${c.h}</h4><p>${c.p}</p></div>`).join('')}
    </div>
  </div>`;
}

SLIDES.push({cls:1, type:'split', eyebrow:'HERRAMIENTA BASE', h:'Qué es Looker Studio y por qué sigue siendo el estándar', step:'1 / 10', text:'Looker Studio (antes Google Data Studio) es gratuito, se conecta directamente a Google Ads, GA4, Meta Ads y archivos CSV o Excel, y es la herramienta que la mayoría de agencias y empresas en Colombia ya usan o esperan que sepas usar. Su gran salto en 2025-2026 fue la llegada de Gemini integrado: ya no hay que saber escribir fórmulas para construir un campo calculado o interpretar una tendencia. Google además lo posiciona como líder del Magic Quadrant de plataformas de analítica empresarial, lo que en la práctica significa soporte, actualizaciones constantes y una curva de aprendizaje que vale la pena invertir una sola vez.', visualType:'rows', rows:[

SLIDES.push({cls:1, type:'split', eyebrow:'FLUJO DE TRABAJO', h:'Cómo construir un dashboard en minutos', step:'3 / 10', text:'El flujo cambió de "diseñar el reporte perfecto desde cero" a un ciclo corto de tres pasos que se repite hasta llegar al panel correcto. La clave está en no aceptar el primer gráfico que entrega la IA sin revisarlo: siempre se pide una segunda pregunta que confirme o cuestione el primer resultado. En la práctica, un dashboard útil rara vez sale perfecto al primer intento — sale de iterar el ciclo 3 o 4 veces en menos de 10 minutos, algo impensable con el método manual de hace unos años.', visualType:'rows', rows:[

SLIDES.push({cls:1, type:'split', eyebrow:'EL RIESGO A VIGILAR', h:'Cuando la IA "alucina" un dato que no existe', step:'6 / 10', text:'Los modelos de IA generativa pueden producir con total seguridad un número, una tendencia o una fórmula que simplemente no se sostiene en los datos reales — el fenómeno conocido como "alucinación". En análisis de datos esto es más peligroso que en una conversación normal, porque el resultado se ve exactamente igual de confiable venga o no de un cálculo correcto: mismo gráfico limpio, mismo tono seguro. La defensa no es dejar de usar la IA, es no aceptar ningún número sin poder rastrear de dónde salió.', visualType:'rows', rows:[

SLIDES.push({cls:2, type:'split', eyebrow:'PUNTO DE PARTIDA', h:'Por qué segmentar: de "todos" al cliente correcto', step:'1 / 11', text:'Enviar el mismo mensaje a toda la base de clientes es la forma más rápida de desperdiciar presupuesto: al cliente VIP le sobra el descuento de bienvenida, y al cliente dormido no le sirve un recordatorio genérico. Segmentar no es una tarea de "ciencia de datos" reservada a especialistas — con IA, cualquier equipo de marketing puede construir segmentos accionables en una sesión de trabajo. Las marcas que dominan esto no tratan la segmentación como un proyecto que se hace una vez al año, sino como un hábito que se revisa cada campaña, porque el comportamiento de los clientes cambia más rápido de lo que cambia el organigrama de la empresa.', visualType:'rows', rows:[

SLIDES.push({cls:2, type:'split', eyebrow:'RFM CON IA', h:'Cómo un asistente de IA calcula los scores en minutos', step:'4 / 11', text:'El cálculo tradicional de RFM exige dividir a cada cliente en quintiles (grupos del 20%) por cada una de las tres dimensiones y sumar los puntajes — un ejercicio de fórmulas que puede tomar una tarde entera en Excel. Herramientas como Julius AI, ChatGPT o Claude hacen ese cálculo estadístico en segundos cuando se les describe la lógica en lenguaje natural, dejando el tiempo humano para lo que realmente importa: decidir qué hacer con cada grupo. Esto no reemplaza el criterio de negocio — lo libera: el marketer deja de ser quien arma la fórmula y pasa a ser quien decide qué umbral tiene sentido para su categoría.', visualType:'rows', rows:[

const deckEl = document.getElementById('deck');
let current = 0;

function build(){
  SLIDES.forEach((s, i)=>{
    const div = document.createElement('div');
    div.className = 'slide type-'+s.type;
    div.dataset.cls = s.cls;
    try{
      const fn = RENDERERS[s.type];
      div.innerHTML = fn ? fn(s) : '<div class="slide-inner center"><p class="lede">(Slide vacío)</p></div>';
    }catch(err){
      console.error('Error renderizando slide', i, s.type, err);
      div.innerHTML = '<div class="slide-inner center"><p class="lede">No se pudo renderizar esta diapositiva ('+(s.h||s.title||s.type)+').</p></div>';
    }
    deckEl.appendChild(div);
  });
}
build();

const slideEls = Array.from(document.querySelectorAll('.slide'));
const progressBar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dots = Array.from(document.querySelectorAll('#classdots button'));
const root = document.documentElement;

function applyPalette(cls){
  const p = PALETTE[cls] || PALETTE[0];
  root.style.setProperty('--accent', p.accent);
  root.style.setProperty('--accent-2', p.accent2);
  root.style.setProperty('--accent-soft', p.soft);
  root.style.setProperty('--accent-ink', p.ink);
}

function pad(n){ return String(n).padStart(2,'0'); }

function go(i, dir){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  slideEls[current].classList.remove('active');
  current = i;
  const s = SLIDES[current];
  applyPalette(s.cls);
  slideEls[current].classList.add('active');
  progressBar.style.width = ((current+1)/SLIDES.length*100)+'%';
  counter.textContent = pad(current+1)+' / '+pad(SLIDES.length);
  prevBtn.classList.toggle('hide', current===0);
  nextBtn.classList.toggle('hide', current===SLIDES.length-1);
  dots.forEach(d=>d.classList.remove('on'));
  const dotIdx = s.cls>=1 ? s.cls-1 : (current > firstIndexOfClass(3) ? 2 : current > firstIndexOfClass(2) ? 1 : 0);
  if (dots[dotIdx]) dots[dotIdx].classList.add('on');
  try{ history.replaceState(null, '', '#s'+(current+1)); }catch(e){ /* algunos entornos con sandbox (iframes de vista previa) bloquean history.replaceState; se ignora sin afectar la navegación */ }
}
function firstIndexOfClass(c){ return SLIDES.findIndex(s=>s.cls===c); }

function next(){ go(current+1); }
function prev(){ go(current-1); }

nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);

document.addEventListener('keydown', (e)=>{
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if (e.key==='Home'){ go(0); }
  else if (e.key==='End'){ go(SLIDES.length-1); }
});

// swipe
let touchX = null, touchY = null;
document.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', (e)=>{
  if (touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); }
  touchX = null;
}, {passive:true});

// click zones (borde izquierdo/derecho de la pantalla, evitando controles)
deckEl.addEventListener('click', (e)=>{
  if (e.target.closest('a, button, .dl-btn')) return;
  const w = window.innerWidth;
  const x = e.clientX;
  if (x < w*0.14) prev();
  else if (x > w*0.86) next();
});

dots.forEach((d,idx)=>{
  d.addEventListener('click', ()=>{
    const cls = idx+1;
    const target = SLIDES.findIndex(s=>s.cls===cls);
    if (target>=0) go(target);
  });
});

// deep link inicial (#s12)
const hash = location.hash.match(/#s(\d+)/);
const startIdx = hash ? Math.max(0, Math.min(SLIDES.length-1, parseInt(hash[1],10)-1)) : 0;
go(startIdx);
</script>
